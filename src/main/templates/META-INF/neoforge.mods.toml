modLoader = "kotlinforforge"
loaderVersion = "[5.10,)"
license = "${mod_license}"

[[mods]]
	modId = "${mod_id}"
	version = "${mod_version}"
	displayName = "${mod_name}"
	authors = "${mod_authors}"
	description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
	modId = "neoforge"
	type = "required"
	versionRange = "${neo_version_range}"
	ordering = "NONE"
	side = "BOTH"

[[dependencies."${mod_id}"]]
	modId = "minecraft"
	mandatory = true
	versionRange = "${minecraft_version_range}"
	ordering = "NONE"
	side = "BOTH"

[[dependencies."${mod_id}"]]
	modId = "create"
	mandatory = true
	versionRange = "[6.0.0,)"
	ordering = "NONE"
	side = "BOTH"

[[dependencies."${mod_id}"]]
	modId = "kotlinforforge"
	mandatory = true
	type = "required"
	versionRange = "[5.10.0,)"
	ordering = "NONE"
	side = "BOTH"