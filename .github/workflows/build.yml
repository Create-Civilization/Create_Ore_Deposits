name: Build

on:
    push:
        branches:
            - 1.21.1
    pull_request:
        branches:
            - 1.21.1

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repo
              uses: actions/checkout@v6.0.2

            - name: Setup JDK
              uses: actions/setup-java@v5
              with:
                  distribution: 'jetbrains'
                  java-version: '21'

            - name: Setup Gradle
              uses: gradle/actions/setup-gradle@v6.1.0
              with:
                  cache-read-only: false

            - name: Get Version
              id: version
              run: echo "MOD_VERSION=$(grep 'mod_version' gradle.properties | cut -d'=' -f2)" >> $GITHUB_OUTPUT

            - name: Build
              run: chmod +x gradlew && ./gradlew build

            - name: Upload
              uses: actions/upload-artifact@v7.0.1
              if: success()
              with:
                  name: create_ore_deposits-${{ steps.version.outputs.MOD_VERSION }}
                  path: build/libs/*.jar